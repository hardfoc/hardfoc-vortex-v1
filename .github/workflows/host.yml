name: CI • Host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ########################################################################
  # Header-only contracts (design §4.1): CiA 402 rules, fault policy,
  # router policy, store codec. No submodules needed.
  ########################################################################
  contracts-host:
    name: contracts-host
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Configure
        working-directory: tests/host
        run: cmake --preset host-debug

      - name: Build
        working-directory: tests/host
        run: cmake --build --preset host-debug

      - name: Test
        working-directory: tests/host
        run: ctest --preset host-debug

  ########################################################################
  # Object dictionary single source (design §4.2, §9.1): every artefact is
  # current, the revision was bumped with the dictionary, and the generator
  # tests pass (EDS through python-canopen, OD.c through CANopenNode).
  ########################################################################
  od-drift:
    name: od-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Only CANopenNode is needed; the HAL's other submodules are not.
      - name: Checkout CANopenNode
        run: |
          git submodule update --init hal/hf-hal-vortex-v1
          git -C hal/hf-hal-vortex-v1 submodule update --init third_party/CANopenNode

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the oldest version odgen supports

      - name: Install odgen requirements
        run: python -m pip install -r tools/odgen/requirements.txt

      - name: odgen --check
        run: python tools/odgen --check

      - name: Generator tests
        env:
          VORTEX_REQUIRE_CANOPENNODE: "1"
        run: python -m pytest -q tools/odgen/tests

  ########################################################################
  # Single required check: green only when every job above is green.
  ########################################################################
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [contracts-host, od-drift]
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "a required job finished with: ${r}"
              exit 1
            fi
          done
