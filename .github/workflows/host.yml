name: CI • Host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ########################################################################
  # Header-only contracts (design §4.1): CiA 402 rules, fault policy,
  # router policy, store codec. No submodules needed.
  ########################################################################
  contracts-host:
    name: contracts-host
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Configure
        working-directory: tests/host
        run: cmake --preset host-debug

      - name: Build
        working-directory: tests/host
        run: cmake --build --preset host-debug

      - name: Test
        working-directory: tests/host
        run: ctest --preset host-debug

  ########################################################################
  # Single required check: green only when every job above is green.
  ########################################################################
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [contracts-host]
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "a required job finished with: ${r}"
              exit 1
            fi
          done
