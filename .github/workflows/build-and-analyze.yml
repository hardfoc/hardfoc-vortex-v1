name: CI • Build · Size · Static Analysis · Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IDF_TARGET: esp32c6          # one place to change target

defaults:
  run:
    shell: bash

jobs:
  ########################################################################
  # 1) BUILD & SIZE
  ########################################################################
  build:
    name: Build ➜ ${{ matrix.idf_version }} · ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        idf_version: [release-v5.5]
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      # The HAL's docs/hf-development-handbook submodule is private and cannot
      # be cloned with the workflow token, so initialise everything else.
      - name: Checkout submodules (except the private handbook)
        run: |
          git submodule update --init hal/hf-hal-vortex-v1
          git -C hal/hf-hal-vortex-v1 submodule init
          git -C hal/hf-hal-vortex-v1 config submodule.docs/hf-development-handbook.update none
          git submodule update --init --recursive

      # Builds inside Espressif's espressif/idf Docker image; the size report
      # runs in the same container because the runner has no ESP-IDF install.
      - name: ESP-IDF build and size report
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: ${{ env.IDF_TARGET }}
          command: >-
            idf.py -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} build &&
            idf.py size-components > build/size.txt &&
            idf.py size --format json2 > build/size.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fw-${{ matrix.idf_version }}-${{ matrix.build_type }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/size.*

  ########################################################################
  # 2) STATIC ANALYSIS (cppcheck, shared HardFOC workflow)
  ########################################################################
  static-analysis:
    name: Static analysis (cppcheck)
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-cpp-analysis.yml@main
    with:
      paths: "main"
      std: "c++17"
      enable: "warning,style,performance,portability,information"

  ########################################################################
  # 3) CODE SCANNING (GitHub CodeQL, build-less C/C++)
  ########################################################################
  codeql:
    name: CodeQL static scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3

  ########################################################################
  # 4) WORKFLOW LINT – keep CI itself healthy
  ########################################################################
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
