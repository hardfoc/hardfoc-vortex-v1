  - index: 0x4002
    id: fault_journal_clear
    name: Fault journal clear
    data_type: U32
    access: wo
    od_extension: FaultJournal
    docs: Write 0x00726C63 ("clr", the byte order of the 0x1010 / 0x1011 signatures).

